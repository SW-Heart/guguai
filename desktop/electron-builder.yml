appId: com.guguai.studio
productName: GuGu AI
artifactName: GuGu-AI-${version}-${os}-${arch}.${ext}
icon: public/favicon.svg
directories:
  output: release
  buildResources: desktop/resources
files:
  - desktop/**
  - package.json
  - node_modules/ffmpeg-static/**
  # The desktop process only needs electron-updater. Keep server-only SDKs
  # (S3 and Alipay) out of the ASAR to reduce installer size and cold-start
  # filesystem scanning on machines with endpoint security enabled.
  - '!node_modules/@aws-sdk/**'
  - '!node_modules/alipay-sdk/**'
extraResources:
  - from: desktop/assets/tray.ico
    to: tray.ico
  - from: desktop/assets/trayTemplate.png
    to: trayTemplate.png
  - from: desktop/assets/trayTemplate@2x.png
    to: trayTemplate@2x.png
asar: true
asarUnpack:
  - node_modules/ffmpeg-static/**/*
mac:
  category: public.app-category.video
  target:
    - dmg
    - zip
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
linux:
  target:
    - AppImage
