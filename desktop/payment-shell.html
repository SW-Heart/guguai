<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>支付宝扫码支付 · GuGu AI</title>
  <style>
    :root{color-scheme:light;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:#f5f7fb;color:#172033;overflow:hidden}
    .bar{height:64px;display:flex;align-items:center;gap:14px;padding:0 12px 0 20px;border-bottom:1px solid #dfe5ef;background:rgba(255,255,255,.96);box-shadow:0 1px 8px rgba(23,32,51,.07);-webkit-app-region:drag;user-select:none}
    .mark{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:#1677ff;color:#fff;font-size:21px;font-weight:800;box-shadow:0 6px 16px rgba(22,119,255,.22)}
    .copy{min-width:0;display:grid;gap:2px}
    .copy strong{font-size:14px;line-height:20px;font-weight:700}
    .copy span{font-size:12px;line-height:18px;color:#6d778a}
    .spacer{flex:1}
    button{height:44px;min-width:132px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;border:1px solid #d8dee9;border-radius:11px;background:#fff;color:#273247;font:600 14px/1 inherit;cursor:pointer;-webkit-app-region:no-drag;transition:background .16s,border-color .16s,box-shadow .16s}
    button:hover{background:#f7f9fc;border-color:#bcc6d6}
    button:focus-visible{outline:3px solid rgba(22,119,255,.28);outline-offset:2px}
    button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
    .copy span.error{color:#b42318;font-weight:600}
  </style>
</head>
<body>
  <header class="bar">
    <span class="mark" aria-hidden="true">支</span>
    <span class="copy"><strong>支付宝扫码支付</strong><span id="paymentHint">关闭付款后会返回 GuGu AI，未付款订单不会扣款</span></span>
    <span class="spacer"></span>
    <button id="closePayment" type="button" aria-label="关闭付款并返回 GuGu AI">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      关闭付款
    </button>
  </header>
  <script>
    const closeButton = document.querySelector('#closePayment');
    closeButton.addEventListener('click', () => window.guguPaymentShell.close());
    window.addEventListener('keydown', event => { if (event.key === 'Escape') window.guguPaymentShell.close(); });
    window.guguPaymentShell.onLoadError(message => { const target=document.querySelector('#paymentHint'); target.textContent=message; target.classList.add('error'); target.setAttribute('role','alert'); });
  </script>
</body>
</html>
