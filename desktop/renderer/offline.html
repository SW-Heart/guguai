<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GuGu AI · 暂时离线</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #18181b;
      background: #f7f7f8;
      --canvas: #f7f7f8;
      --ink: #18181b;
      --muted: #667085;
      --brand: #6366f1;
      --danger: #d84d5b;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 34%, rgba(129, 140, 248, .12), transparent 30%),
        radial-gradient(circle at 4% 100%, rgba(196, 181, 253, .16), transparent 32%),
        var(--canvas);
    }

    body::before {
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(99, 102, 241, .025) 1px, transparent 1px), linear-gradient(90deg, rgba(99, 102, 241, .025) 1px, transparent 1px);
      background-size: 48px 48px;
      content: "";
      pointer-events: none;
    }

    .hidden { display: none !important; }
    .desktop-runtime { padding-top: 56px; }
    .desktop-runtime:not(.desktop-darwin) { padding-top: 72px; }

    .desktop-drag-region {
      position: fixed;
      z-index: 10;
      top: 0;
      right: 144px;
      left: 0;
      height: 56px;
      -webkit-app-region: drag;
    }

    .desktop-window-controls {
      position: fixed;
      z-index: 20;
      top: 0;
      right: 0;
      height: 56px;
      display: flex;
      border-left: 1px solid rgba(24, 24, 27, .07);
      background: rgba(255, 255, 255, .58);
      backdrop-filter: blur(16px);
      -webkit-app-region: no-drag;
    }

    .desktop-window-controls button {
      width: 46px;
      height: 56px;
      padding: 0;
      border: 0;
      color: #8b93a3;
      background: transparent;
      display: grid;
      place-items: center;
      cursor: pointer;
      -webkit-app-region: no-drag;
    }

    .desktop-window-controls button:hover { color: var(--ink); background: rgba(99, 102, 241, .08); }
    .desktop-window-controls .window-close:hover { color: #fff; background: var(--danger); }
    .desktop-window-controls button:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }
    .desktop-window-controls button svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.55; }
    .desktop-window-controls .window-icon { width: 13px; height: 13px; }

    .offline-shell {
      position: relative;
      z-index: 1;
      min-height: calc(100vh - 56px);
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .offline-state {
      width: min(380px, 100%);
      text-align: center;
    }

    .offline-stage {
      position: relative;
      width: 180px;
      height: 142px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
    }

    .offline-icon {
      position: relative;
      z-index: 1;
      width: 104px;
      height: 104px;
      border: 1px solid rgba(255, 255, 255, .86);
      border-radius: 30px;
      color: var(--danger);
      background: linear-gradient(145deg, rgba(255, 255, 255, .78), rgba(255, 241, 242, .44));
      display: grid;
      place-items: center;
      box-shadow: 0 22px 44px rgba(93, 79, 125, .1), inset 0 1px rgba(255, 255, 255, .96);
      backdrop-filter: blur(18px);
    }

    .offline-corner {
      position: absolute;
      width: 18px;
      height: 18px;
      border-color: rgba(99, 102, 241, .36);
      border-style: solid;
      content: "";
    }

    .offline-corner.top-left { top: 19px; left: 12px; border-width: 1px 0 0 1px; border-radius: 5px 0 0 0; }
    .offline-corner.top-right { top: 19px; right: 12px; border-width: 1px 1px 0 0; border-radius: 0 5px 0 0; }
    .offline-corner.bottom-left { bottom: 19px; left: 12px; border-width: 0 0 1px 1px; border-radius: 0 0 0 5px; }
    .offline-corner.bottom-right { right: 12px; bottom: 19px; border-width: 0 1px 1px 0; border-radius: 0 0 5px 0; }

    .offline-icon svg { width: 44px; height: 44px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
    .offline-icon .signal-dot { fill: currentColor; stroke: none; }

    .offline-state h1 {
      margin: 0;
      color: var(--ink);
      font-size: 21px;
      font-weight: 650;
      letter-spacing: -.045em;
    }

    .offline-state p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 450;
      letter-spacing: -.01em;
      line-height: 1.6;
    }

    .offline-detail {
      max-width: 320px;
      margin: 8px auto 0 !important;
      color: #98a0ae !important;
      font-size: 11px !important;
      line-height: 1.5 !important;
    }

    .offline-retry {
      min-width: 96px;
      min-height: 40px;
      margin-top: 22px;
      padding: 0 18px;
      border: 1px solid rgba(99, 102, 241, .16);
      border-radius: 10px;
      color: #fff;
      background: var(--brand);
      box-shadow: 0 8px 18px rgba(99, 102, 241, .2);
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease, opacity 160ms ease;
    }

    .offline-retry:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(99, 102, 241, .26); }
    .offline-retry:active { transform: translateY(0); }
    .offline-retry:disabled { cursor: wait; opacity: .64; }
    .offline-retry:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }

    @media (prefers-reduced-motion: reduce) {
      .offline-retry { transition: none; }
    }

    @media (max-width: 620px) {
      .offline-shell { padding: 24px; }
      .offline-stage { margin-bottom: 18px; }
      .offline-icon { width: 92px; height: 92px; border-radius: 27px; }
      .offline-icon svg { width: 40px; height: 40px; }
    }
  </style>
</head>
<body>
  <div id="desktopDragRegion" class="desktop-drag-region hidden" aria-hidden="true"></div>
  <div id="desktopWindowControls" class="desktop-window-controls hidden" role="group" aria-label="窗口控制">
    <button id="windowMinimize" type="button" aria-label="最小化窗口" title="最小化"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
    <button id="windowMaximize" type="button" aria-label="最大化窗口" title="最大化"><svg class="window-icon maximize-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="1"/></svg><svg class="window-icon restore-icon hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8h10v10H8z"/><path d="M6 16H5V6h10v1"/></svg></button>
    <button id="windowClose" class="window-close" type="button" aria-label="关闭窗口" title="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
  </div>

  <main class="offline-shell">
    <section class="offline-state" role="alert" aria-live="assertive">
      <div class="offline-stage" aria-hidden="true">
        <span class="offline-corner top-left"></span>
        <span class="offline-corner top-right"></span>
        <span class="offline-corner bottom-left"></span>
        <span class="offline-corner bottom-right"></span>
        <div class="offline-icon">
        <svg viewBox="0 0 48 48">
          <path d="M9 19.5c8.4-7.8 21.6-7.8 30 0"/>
          <path d="M15.5 26c4.8-4.4 12.2-4.4 17 0"/>
          <path d="M22 32.5c1.2-1.1 2.8-1.1 4 0"/>
          <path d="m10 10 28 28"/>
          <circle class="signal-dot" cx="24" cy="36.5" r="2.2"/>
        </svg>
        </div>
      </div>
      <h1>无法连接服务</h1>
      <p>请检查网络后重试。</p>
      <p id="offlineDetail" class="offline-detail hidden"></p>
      <button id="retryConnection" class="offline-retry" type="button">重试</button>
    </section>
  </main>

  <script>
    const bridge = window.guguDesktop;
    const $ = selector => document.querySelector(selector);

    function setupWindowControls(info) {
      document.body.classList.add('desktop-runtime', `desktop-${info?.platform || 'win32'}`);
      const windowApi = bridge?.window;
      if (!windowApi || info?.platform === 'darwin') return;
      $('#desktopDragRegion').classList.remove('hidden');
      if (info?.nativeWindowControls === true) return;
      $('#desktopWindowControls').classList.remove('hidden');
      const updateState = maximized => {
        const isMaximized = Boolean(maximized);
        $('#windowMaximize')?.setAttribute('aria-label', isMaximized ? '还原窗口' : '最大化窗口');
        $('#windowMaximize').title = isMaximized ? '还原' : '最大化';
        $('.maximize-icon')?.classList.toggle('hidden', isMaximized);
        $('.restore-icon')?.classList.toggle('hidden', !isMaximized);
      };
      $('#windowMinimize').onclick = () => void windowApi.minimize();
      $('#windowMaximize').onclick = () => void windowApi.toggleMaximize();
      $('#windowClose').onclick = () => void windowApi.close();
      windowApi.onState?.(payload => updateState(payload?.maximized));
      Promise.resolve(windowApi.isMaximized?.()).then(updateState).catch(() => updateState(false));
    }

    bridge?.getInfo?.().then(setupWindowControls).catch(() => setupWindowControls());

    const detail = new URLSearchParams(window.location.search).get('message');
    if (detail) {
      const detailElement = $('#offlineDetail');
      detailElement.textContent = detail;
      detailElement.classList.remove('hidden');
    }

    const retryButton = $('#retryConnection');
    retryButton.onclick = async () => {
      retryButton.disabled = true;
      retryButton.textContent = '正在重试…';
      try {
        await bridge?.retry?.();
      } catch {
        retryButton.disabled = false;
        retryButton.textContent = '重试';
      }
    };

    // Keep the page calm while the connection recovers in the background.
    window.setTimeout(() => void bridge?.retry?.(), 5000);
  </script>
</body>
</html>
