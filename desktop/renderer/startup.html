<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GuGu AI · 正在启动</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f7f7f8;
      --ink: #18181b;
      --ink-soft: #3f3f46;
      --muted: #667085;
      --faint: #8b95a5;
      --brand: #6366f1;
      --brand-line: rgba(99,102,241,.16);
      --glass-surface: linear-gradient(145deg, rgba(255,255,255,.78), rgba(238,240,255,.48));
      --glass-line: rgba(255,255,255,.72);
      --glass-shadow: 0 18px 52px rgba(24,24,27,.1), 0 3px 10px rgba(24,24,27,.05), inset 0 1px rgba(255,255,255,.86);
      font-family: Inter, Geist, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--canvas);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { position: relative; min-height: 100vh; overflow: hidden; background: radial-gradient(circle at 18% 10%, rgba(165,180,252,.22), transparent 30%), radial-gradient(circle at 82% 86%, rgba(192,132,252,.16), transparent 27%), linear-gradient(140deg, #fff 0%, var(--canvas) 54%, #f0f0f3 100%); }
    body::before { position: fixed; inset: 0; z-index: 0; pointer-events: none; content: ""; opacity: .24; background-image: linear-gradient(rgba(99,102,241,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(99,102,241,.08) 1px, transparent 1px); background-size: 72px 72px; mask-image: radial-gradient(ellipse at 50% 50%, #000 0%, transparent 68%); -webkit-mask-image: radial-gradient(ellipse at 50% 50%, #000 0%, transparent 68%); }
    body.desktop-runtime { padding-top: 56px; }
    .hidden { display: none !important; }
    .desktop-drag-region { position: fixed; z-index: 10; top: 0; right: 144px; left: 0; height: 56px; -webkit-app-region: drag; }
    .desktop-window-controls { position: fixed; z-index: 20; top: 0; right: 0; height: 56px; display: flex; border-left: 1px solid rgba(24,24,27,.08); background: rgba(247,247,248,.72); box-shadow: -8px 0 18px rgba(24,24,27,.035); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); -webkit-app-region: no-drag; }
    .desktop-window-controls button { width: 46px; height: 56px; padding: 0; border: 0; color: var(--muted); background: transparent; display: grid; place-items: center; cursor: pointer; -webkit-app-region: no-drag; transition: color 180ms cubic-bezier(.2,.8,.2,1), background 180ms cubic-bezier(.2,.8,.2,1); }
    .desktop-window-controls button:hover { color: var(--ink); background: rgba(24,24,27,.06); }
    .desktop-window-controls button:active { background: rgba(24,24,27,.1); }
    .desktop-window-controls button svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.55; stroke-linecap: round; stroke-linejoin: round; }
    .desktop-window-controls .window-close:hover { color: #fff; background: #d6535c; }
    .desktop-window-controls .window-icon { width: 13px; height: 13px; }
    .desktop-window-controls button:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }
    .startup-shell { position: relative; z-index: 1; min-height: calc(100vh - 56px); display: grid; place-items: center; padding: 32px; }
    .startup-content { width: min(430px, 100%); text-align: center; }
    .startup-stage { position: relative; width: 190px; height: 150px; margin: 0 auto 25px; display: grid; place-items: center; }
    .startup-corner { position: absolute; z-index: 1; width: 21px; height: 21px; border-color: rgba(99,102,241,.34); border-style: solid; }
    .startup-corner.top-left { top: 4px; left: 8px; border-width: 1px 0 0 1px; border-radius: 8px 0 0; }
    .startup-corner.top-right { top: 4px; right: 8px; border-width: 1px 1px 0 0; border-radius: 0 8px 0 0; }
    .startup-corner.bottom-left { bottom: 4px; left: 8px; border-width: 0 0 1px 1px; border-radius: 0 0 0 8px; }
    .startup-corner.bottom-right { right: 8px; bottom: 4px; border-width: 0 1px 1px 0; border-radius: 0 0 8px; }
    .startup-lens { position: relative; z-index: 2; width: 108px; height: 108px; border: 1px solid rgba(255,255,255,.84); border-radius: 30px; background: linear-gradient(145deg, rgba(255,255,255,.62), rgba(231,233,255,.26)); box-shadow: 0 16px 32px rgba(73,76,160,.11), inset 0 1px rgba(255,255,255,.9); display: grid; place-items: center; backdrop-filter: blur(24px) saturate(1.22); -webkit-backdrop-filter: blur(24px) saturate(1.22); }
    .startup-mark { width: 60px; height: 60px; border-radius: 17px; background: #18181b; display: grid; place-items: center; box-shadow: 0 9px 22px rgba(24,24,27,.2); }
    .startup-mark-icon { display: block; width: 60px; height: 60px; border-radius: 17px; }
    .startup-trace { position: absolute; z-index: 3; right: 20px; bottom: 14px; left: 20px; height: 2px; overflow: hidden; border-radius: 99px; background: rgba(99,102,241,.1); }
    .startup-trace::after { position: absolute; top: 0; left: 0; width: 34%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, transparent, var(--brand), transparent); content: ""; animation: trace 1.65s ease-in-out infinite; }
    .startup-brand h1 { margin: 0; color: var(--ink); font-size: 20px; font-weight: 650; letter-spacing: -.035em; }
    .startup-status { width: max-content; max-width: 100%; min-height: 36px; margin: 18px auto 0; padding: 0 14px; border: 1px solid rgba(255,255,255,.68); border-radius: 999px; background: rgba(255,255,255,.38); box-shadow: inset 0 1px rgba(255,255,255,.72); backdrop-filter: blur(14px) saturate(1.12); -webkit-backdrop-filter: blur(14px) saturate(1.12); display: flex; align-items: center; justify-content: center; gap: 9px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .startup-spinner { width: 14px; height: 14px; flex: 0 0 14px; border: 2px solid rgba(99,102,241,.16); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes trace { 0% { transform: translateX(-130%); } 100% { transform: translateX(390%); } }
    .update-dialog { position: fixed; z-index: 40; inset: 0; padding: 24px; background: rgba(24,24,27,.14); display: grid; place-items: center; backdrop-filter: blur(10px) saturate(1.05); -webkit-backdrop-filter: blur(10px) saturate(1.05); }
    .update-card { position: relative; width: min(400px, 100%); padding: 26px 28px 24px; border: 1px solid var(--glass-line); border-radius: 22px; color: var(--ink); background: var(--glass-surface); box-shadow: var(--glass-shadow), 0 30px 80px rgba(24,24,27,.12); backdrop-filter: blur(28px) saturate(1.12); -webkit-backdrop-filter: blur(28px) saturate(1.12); text-align: left; }
    .update-close { position: absolute; z-index: 1; top: 12px; right: 12px; width: 34px; height: 34px; padding: 7px; border: 1px solid rgba(255,255,255,.68); border-radius: 10px; color: var(--muted); background: rgba(255,255,255,.42); display: grid; place-items: center; cursor: pointer; transition: color 180ms cubic-bezier(.2,.8,.2,1), background 180ms cubic-bezier(.2,.8,.2,1); }
    .update-close:hover { color: var(--ink); background: rgba(255,255,255,.72); }
    .update-close svg { width: 17px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-width: 1.7; }
    .update-mark { width: 44px; height: 44px; margin-bottom: 18px; border: 1px solid rgba(99,102,241,.16); border-radius: 13px; color: var(--brand); background: linear-gradient(145deg, rgba(255,255,255,.72), rgba(224,226,255,.68)); display: grid; place-items: center; box-shadow: inset 0 1px rgba(255,255,255,.82); }
    .update-mark svg { width: 24px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.55; }
    .update-card h2 { margin: 0; color: var(--ink); font-size: 22px; font-weight: 650; letter-spacing: -.035em; }
    .update-card > p { max-width: 310px; margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .update-versions { margin: 22px 0 18px; padding: 12px 14px; border: 1px solid rgba(255,255,255,.62); border-radius: 13px; background: rgba(255,255,255,.42); display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; gap: 12px; }
    .update-versions span { min-width: 0; display: grid; gap: 4px; }
    .update-versions span:last-child { text-align: right; }
    .update-versions small { color: var(--faint); font-size: 10px; }
    .update-versions strong { color: var(--ink-soft, #3f3f46); font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .update-versions i { width: 16px; height: 1px; background: var(--brand-line); }
    .update-progress-wrap { min-height: 39px; display: grid; gap: 7px; }
    .update-progress-track { height: 5px; overflow: hidden; border-radius: 99px; background: rgba(99,102,241,.1); }
    .update-progress { position: relative; width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #6366f1, #8b5cf6); transition: width 180ms cubic-bezier(.2,.8,.2,1); }
    .update-progress.is-indeterminate { width: 38%; animation: progress 1.15s ease-in-out infinite; }
    @keyframes progress { 0%, 100% { transform: translateX(-110%); } 50% { transform: translateX(240%); } }
    .update-progress-wrap > span { color: var(--faint); font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; text-align: right; }
    .update-hint { min-height: 18px; margin-top: 12px !important; color: var(--faint) !important; font-size: 10px !important; }
    .update-actions { margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(99,102,241,.1); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .update-later, .update-action { min-height: 40px; border-radius: 8px; font-size: 11px; cursor: pointer; }
    .update-later { padding: 7px 12px; border: 1px solid transparent; color: var(--muted); background: transparent; }
    .update-later:hover { color: var(--ink); border-color: rgba(255,255,255,.56); background: rgba(255,255,255,.42); }
    .update-action { min-width: 118px; padding: 7px 16px; border: 1px solid rgba(255,255,255,.42); color: #fff; background: linear-gradient(135deg, #5c5ee9, #8062ec); box-shadow: 0 8px 18px rgba(91,92,232,.18); }
    .update-action:disabled { color: var(--faint); background: rgba(255,255,255,.42); border-color: rgba(255,255,255,.58); box-shadow: none; cursor: wait; }
    .update-card.ready .update-mark { color: #397052; border-color: rgba(77,124,90,.18); background: linear-gradient(145deg, rgba(237,246,239,.88), rgba(214,239,220,.68)); }
    .update-card.error .update-mark { color: #b24d55; border-color: rgba(178,77,85,.18); background: linear-gradient(145deg, rgba(255,241,242,.9), rgba(255,224,227,.7)); }
    @media (prefers-reduced-motion: reduce) { .startup-spinner, .startup-trace::after, .update-progress.is-indeterminate { animation: none; } }
    @media (max-width: 560px) { .startup-shell { padding: 22px; } .startup-stage { width: 180px; height: 144px; } .startup-corner.top-left, .startup-corner.bottom-left { left: 4px; } .startup-corner.top-right, .startup-corner.bottom-right { right: 4px; } .update-card { padding: 24px 21px 22px; } .update-versions { gap: 9px; padding-inline: 10px; } }
  </style>
</head>
<body>
  <div id="desktopDragRegion" class="desktop-drag-region" aria-hidden="true"></div>
  <div id="desktopWindowControls" class="desktop-window-controls hidden" role="group" aria-label="窗口控制">
    <button id="windowMinimize" type="button" aria-label="最小化窗口" title="最小化"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
    <button id="windowMaximize" type="button" aria-label="最大化窗口" title="最大化"><svg class="window-icon maximize-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="1"/></svg><svg class="window-icon restore-icon hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8h10v10H8z"/><path d="M6 16H5V6h10v1"/></svg></button>
    <button id="windowClose" class="window-close" type="button" aria-label="关闭窗口" title="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
  </div>
  <main class="startup-shell">
    <section class="startup-content" aria-live="polite">
      <div class="startup-stage" aria-hidden="true">
        <span class="startup-corner top-left"></span>
        <span class="startup-corner top-right"></span>
        <span class="startup-corner bottom-left"></span>
        <span class="startup-corner bottom-right"></span>
        <div class="startup-lens">
          <div class="startup-mark">
            <svg class="startup-mark-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
              <rect width="64" height="64" rx="16" fill="#18181b"/>
              <rect x="11" y="16.5" width="28" height="9" rx="3" fill="#fff" transform="rotate(-38 25 21)"/>
              <rect x="25" y="38.5" width="28" height="9" rx="3" fill="#fff" transform="rotate(-38 39 43)"/>
            </svg>
          </div>
        </div>
        <div class="startup-trace"></div>
      </div>
      <div class="startup-brand">
        <h1>GuGu AI</h1>
      </div>
      <div class="startup-status"><div class="startup-spinner" aria-hidden="true"></div><span id="startupStatus">正在连接服务…</span></div>
    </section>
  </main>
  <section id="updateDialog" class="update-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="updateTitle" aria-describedby="updateMessage">
    <div class="update-card">
      <button id="closeUpdate" class="update-close" type="button" aria-label="关闭更新提示" title="稍后提醒"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      <div class="update-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 4v10M8 10l4 4 4-4M5 19h14"/><path d="M5 5.5A8.5 8.5 0 0 1 19 8"/></svg></div>
      <h2 id="updateTitle">发现新版本</h2>
      <p id="updateMessage">准备下载最新版本。</p>
      <div class="update-versions" aria-label="版本信息"><span><small>当前版本</small><strong id="currentVersion">—</strong></span><i aria-hidden="true"></i><span><small>新版本</small><strong id="nextVersion">—</strong></span></div>
      <div id="progressWrap" class="update-progress-wrap" aria-live="polite"><div class="update-progress-track"><div id="progress" class="update-progress"></div></div><span id="progressLabel">准备下载…</span></div>
      <p id="updateHint" class="update-hint">下载完成后重启更新。</p>
      <footer class="update-actions"><button id="laterUpdate" class="update-later" type="button">稍后</button><button id="updateAction" class="update-action" type="button" disabled>正在下载…</button></footer>
    </div>
  </section>
  <script>
    const bridge = window.guguDesktop;
    const $ = selector => document.querySelector(selector);
    let updateState = { status: 'idle' };
    let updateDismissed = false;

    function setupWindowControls(info) {
      document.body.classList.add('desktop-runtime', `desktop-${info?.platform || 'win32'}`);
      const windowApi = bridge?.window;
      if (!windowApi || info?.platform === 'darwin') return;
      if (info?.nativeWindowControls === true) return;
      $('#desktopWindowControls').classList.remove('hidden');
      const updateState = maximized => {
        const isMaximized = Boolean(maximized);
        $('#windowMaximize')?.setAttribute('aria-label', isMaximized ? '还原窗口' : '最大化窗口');
        $('#windowMaximize').title = isMaximized ? '还原' : '最大化';
        $('.maximize-icon')?.classList.toggle('hidden', isMaximized);
        $('.restore-icon')?.classList.toggle('hidden', !isMaximized);
      };
      $('#windowMinimize').onclick = () => void windowApi.minimize();
      $('#windowMaximize').onclick = () => void windowApi.toggleMaximize();
      $('#windowClose').onclick = () => void windowApi.close();
      windowApi.onState?.(payload => updateState(payload?.maximized));
      Promise.resolve(windowApi.isMaximized?.()).then(updateState).catch(() => updateState(false));
    }

    function closeUpdateDialog() {
      updateDismissed = true;
      $('#updateDialog').classList.add('hidden');
      void bridge?.window?.setModalState?.(false);
    }

    function openUpdateDialog() {
      if (updateDismissed) return;
      $('#updateDialog').classList.remove('hidden');
      void bridge?.window?.setModalState?.(true);
    }

    function renderUpdate(payload, { open = true } = {}) {
      updateState = { ...updateState, ...(payload || {}) };
      const status = updateState.status;
      const dialog = $('#updateDialog');
      const card = dialog.querySelector('.update-card');
      const progress = $('#progress');
      const progressWrap = $('#progressWrap');
      const percent = Number(updateState.percent);
      const hasProgress = Number.isFinite(percent) && percent >= 0;
      $('#currentVersion').textContent = updateState.currentVersion || '—';
      $('#nextVersion').textContent = updateState.version || '新版本';
      card.classList.toggle('ready', status === 'downloaded');
      card.classList.toggle('error', status === 'error');
      progress.classList.remove('is-indeterminate');
      progressWrap.classList.remove('hidden');
      if (status === 'available') {
        $('#updateTitle').textContent = '发现新版本';
        $('#updateMessage').textContent = '新版本已就绪。';
        progress.style.width = '0%';
        progress.classList.add('is-indeterminate');
        $('#progressLabel').textContent = '准备下载…';
        $('#updateHint').textContent = '下载完成后重启更新。';
        $('#updateAction').textContent = '正在下载…';
        $('#updateAction').disabled = true;
      } else if (status === 'downloading') {
        $('#updateTitle').textContent = '正在下载更新';
        $('#updateMessage').textContent = '正在获取最新版本。';
        progress.style.width = `${Math.max(0, Math.min(100, hasProgress ? percent : 0))}%`;
        if (!hasProgress) progress.classList.add('is-indeterminate');
        $('#progressLabel').textContent = hasProgress ? `${Math.round(percent)}% · 正在下载` : '正在下载…';
        $('#updateHint').textContent = '下载完成后重启更新。';
        $('#updateAction').textContent = '正在下载…';
        $('#updateAction').disabled = true;
      } else if (status === 'downloaded') {
        $('#updateTitle').textContent = '更新已下载';
        $('#updateMessage').textContent = '新版本已准备好。';
        progress.style.width = '100%';
        $('#progressLabel').textContent = '下载完成';
        $('#updateHint').textContent = '重启客户端完成更新。';
        $('#updateAction').textContent = '重启更新';
        $('#updateAction').disabled = false;
      } else if (status === 'installing') {
        $('#updateTitle').textContent = '正在退出客户端';
        $('#updateMessage').textContent = '客户端即将关闭。';
        progress.style.width = '100%';
        $('#progressLabel').textContent = '正在退出…';
        $('#updateHint').textContent = '按安装程序提示完成更新。';
        $('#updateAction').textContent = '正在退出…';
        $('#updateAction').disabled = true;
      } else if (status === 'error') {
        $('#updateTitle').textContent = '更新失败';
        $('#updateMessage').textContent = updateState.message || '更新下载失败，请稍后重试。';
        progressWrap.classList.add('hidden');
        $('#updateHint').textContent = '请稍后重新检查。';
        $('#updateAction').textContent = '重新检查';
        $('#updateAction').disabled = false;
      }
      if (open && ['available', 'downloading', 'downloaded', 'error'].includes(status)) openUpdateDialog();
    }

    $('#closeUpdate').onclick = $('#laterUpdate').onclick = closeUpdateDialog;
    $('#updateAction').onclick = async () => {
      if (updateState.status === 'error') {
        closeUpdateDialog();
        updateDismissed = false;
        try { await bridge?.updates?.check?.(); } catch (error) { $('#startupStatus').textContent = error.message; }
        return;
      }
      if (updateState.status !== 'downloaded') return;
      $('#updateAction').disabled = true;
      try {
        const started = await bridge?.updates?.install?.();
        if (!started) throw new Error('更新安装包尚未准备好，请稍后再试');
      } catch (error) {
        renderUpdate({ status: 'error', message: error.message, version: updateState.version });
      }
    };

    bridge?.updates?.onStatus?.(payload => {
      updateState = { ...updateState, ...(payload || {}) };
      if (['current', 'unconfigured', 'idle'].includes(payload?.status)) {
        $('#startupStatus').textContent = '正在连接服务…';
        $('#updateDialog').classList.add('hidden');
        updateDismissed = false;
        void bridge?.window?.setModalState?.(false);
        return;
      }
      if (payload?.status === 'checking') $('#startupStatus').textContent = '正在检查更新…';
      renderUpdate(payload);
    });
    Promise.all([bridge?.getInfo?.(), bridge?.updates?.getStatus?.()]).then(([info, status]) => {
      setupWindowControls(info || {});
      if (status?.status && status.status !== 'idle') {
        updateState = { ...updateState, ...status };
        renderUpdate(status);
      }
    }).catch(() => {});
  </script>
</body>
</html>
