<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f6f7f9">
  <meta name="color-scheme" content="light">
  <title>GuGu 管理后台</title>
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/favicon.svg?v=2">
  <link rel="stylesheet" href="/guguadmin.css?v=19">
  <link rel="stylesheet" href="/guguadmin-routes.css?v=7">
</head>
<body>
  <main id="adminLogin" class="login-shell hidden">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="login-brand"><span class="brand-gem" aria-hidden="true"></span><span>GuGu AI</span></div>
      <h1 id="loginTitle">管理后台</h1>
      <p class="login-subtitle">使用管理员账号登录，管理用户、订单、模型与平台内容。</p>
      <form id="loginForm" novalidate>
        <label class="field">
          <span class="field-label">管理员账号</span>
          <input id="loginUsername" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="请输入账号" required>
        </label>
        <label class="field">
          <span class="field-label">密码</span>
          <span class="input-with-action">
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
            <button id="loginPasswordToggle" class="input-action" type="button" aria-label="显示密码" aria-pressed="false">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </span>
          <span id="loginCaps" class="field-hint warn-text" hidden>大写锁定已开启</span>
        </label>
        <div id="loginError" class="form-error" role="alert" aria-live="assertive"></div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">登录</button>
      </form>
      <p class="login-footnote">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        仅限管理员访问，登录状态会在一段时间无操作后失效。
      </p>
    </section>
  </main>

  <div id="adminApp" class="app-shell hidden">
    <aside class="sidebar" aria-label="管理后台导航">
      <div class="sidebar-brand">
        <span class="brand-gem" aria-hidden="true"></span>
        <div><b>GuGu AI</b><span>管理后台</span></div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-group">
          <div class="nav-group-label">概览</div>
          <button class="nav" data-view="overview" type="button" aria-controls="view-overview"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg><span>总览</span></button>
        </div>
        <div class="nav-group">
          <div class="nav-group-label">运营</div>
          <button class="nav" data-view="users" type="button" aria-controls="view-users"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>用户管理</span></button>
          <button class="nav" data-view="orders" type="button" aria-controls="view-orders"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg><span>付费订单</span></button>
          <button class="nav" data-view="invites" type="button" aria-controls="view-invites"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></svg><span>邀请码</span></button>
          <button class="nav" data-view="announcements" type="button" aria-controls="view-announcements"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg><span>消息通知</span></button>
        </div>
        <div class="nav-group">
          <div class="nav-group-label">模型</div>
          <button class="nav" data-view="models" type="button" aria-controls="view-models"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg><span>模型与价格</span></button>
          <button class="nav" data-view="credentials" type="button" aria-controls="view-credentials"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></svg><span>渠道与 Key</span></button>
        </div>
        <div class="nav-group">
          <div class="nav-group-label">系统</div>
          <button class="nav" data-view="logs" type="button" aria-controls="view-logs"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg><span>日志中心</span></button>
        </div>
      </nav>
      <div class="sidebar-account">
        <span id="adminAvatar" class="avatar" aria-hidden="true">A</span>
        <div class="sidebar-account-main"><b id="adminName">管理员</b><span>管理员</span></div>
        <button id="logoutButton" class="btn btn-sm btn-ghost" type="button" title="退出登录">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg><span>退出</span>
        </button>
      </div>
    </aside>
    <main class="content" id="adminContent">
      <section id="view-overview" class="view" aria-labelledby="overviewTitle"></section>
      <section id="view-users" class="view hidden" aria-labelledby="usersTitle"></section>
      <section id="view-orders" class="view hidden" aria-labelledby="ordersTitle"></section>
      <section id="view-invites" class="view hidden" aria-labelledby="invitesTitle"></section>
      <section id="view-announcements" class="view hidden" aria-labelledby="announcementsTitle"></section>
      <section id="view-models" class="view hidden" aria-labelledby="modelsTitle"></section>
      <section id="view-credentials" class="view hidden" aria-labelledby="credentialsTitle"></section>
      <section id="view-logs" class="view hidden" aria-labelledby="logsTitle"></section>
    </main>
  </div>

  <dialog id="adminDialog" class="admin-dialog" aria-labelledby="adminDialogTitle" aria-describedby="adminDialogDescription">
    <form id="adminDialogForm" class="admin-dialog-card" novalidate>
      <header class="admin-dialog-head">
        <span id="adminDialogIcon" class="admin-dialog-icon" aria-hidden="true" hidden></span>
        <div class="admin-dialog-heading">
          <span id="adminDialogKicker" class="admin-dialog-kicker"></span>
          <h2 id="adminDialogTitle">编辑</h2>
          <p id="adminDialogDescription"></p>
        </div>
        <button id="adminDialogClose" class="icon-button" type="button" aria-label="关闭">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </header>
      <div id="adminDialogBody" class="admin-dialog-body"></div>
      <div id="adminDialogError" class="admin-dialog-error" role="alert"></div>
      <footer class="admin-dialog-footer">
        <button id="adminDialogCancel" class="btn" type="button">取消</button>
        <button id="adminDialogSubmit" class="btn btn-primary" type="submit">保存</button>
      </footer>
    </form>
  </dialog>
  <div id="toast" class="toast" popover="manual" role="status" aria-live="polite"></div>
  <script type="module" src="/guguadmin.js?v=27"></script>
</body>
</html>
