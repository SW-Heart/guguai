<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#070b11">
  <meta name="color-scheme" content="dark">
  <title>GuGu 管理后台</title>
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/favicon.svg?v=2">
  <link rel="stylesheet" href="/guguadmin.css?v=13">
  <link rel="stylesheet" href="/guguadmin-routes.css?v=5">
</head>
<body>
  <main id="adminLogin" class="login-shell">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="login-mark" aria-hidden="true">G</div>
      <div class="eyebrow">GUGU AI / CONTROL ROOM</div>
      <h1 id="loginTitle">管理后台</h1>
      <p>集中管理用户、模型、价格与平台运行状态。</p>
      <form id="loginForm">
        <label>管理员账号<input id="loginUsername" name="username" autocomplete="username" autocapitalize="none" required></label>
        <label>密码<input id="loginPassword" name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">进入后台</button>
        <div id="loginError" class="error" role="alert" aria-live="assertive"></div>
      </form>
      <div class="login-hint"><span class="status-dot"></span> 管理员会话使用安全 Cookie 保护</div>
    </section>
  </main>

  <main id="adminApp" class="app-shell hidden">
    <header class="topbar">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">G</div>
        <div><span class="eyebrow">GUGU AI / CONTROL ROOM</span><h1>运营控制台</h1></div>
      </div>
      <div class="topbar-actions">
        <span id="sessionStatus" class="session-status"><span class="status-dot"></span>在线</span>
        <span id="adminName" class="admin-name"></span>
        <button id="logoutButton" class="ghost" type="button">退出登录</button>
      </div>
    </header>
    <div class="layout">
      <nav class="sidebar" aria-label="管理后台导航">
        <div class="sidebar-label">工作区</div>
        <button class="nav active" data-view="overview" aria-current="page" aria-controls="view-overview"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m4 10 8-6 8 6v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Z"/><path d="M9 20v-6h6v6"/></svg></span>总览</button>
        <button class="nav" data-view="users" aria-controls="view-users"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M15 5.5a3 3 0 0 1 0 5.8M16 14.5a5 5 0 0 1 4.5 4.5"/></svg></span>用户管理</button>
        <button class="nav" data-view="orders" aria-controls="view-orders"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h16v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M4 10h16M8 15h4"/></svg></span>付费订单</button>
        <button class="nav" data-view="models" aria-controls="view-models"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9Z"/><path d="m4.5 7.8 7.5 4.3 7.5-4.3M12 12.1V21"/></svg></span>模型与价格</button>
        <button class="nav" data-view="credentials" aria-controls="view-credentials"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 8-8M16 4l4 4M14 9l2 2"/></svg></span>渠道与 Key</button>
        <button class="nav" data-view="invites" aria-controls="view-invites"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 12h8M12 8v8"/><circle cx="12" cy="12" r="8.5"/></svg></span>邀请码</button>
        <button class="nav" data-view="announcements" aria-controls="view-announcements"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 13h3l9 5V6l-9 5H4a1 1 0 0 0-1 1v0a1 1 0 0 0 1 1Z"/><path d="M7 13v5M19 9.5a4 4 0 0 1 0 5"/></svg></span>消息通知</button>
        <button class="nav" data-view="logs" aria-controls="view-logs"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 5h14M5 12h14M5 19h9"/><circle cx="3.5" cy="5" r=".6" fill="currentColor" stroke="none"/><circle cx="3.5" cy="12" r=".6" fill="currentColor" stroke="none"/><circle cx="3.5" cy="19" r=".6" fill="currentColor" stroke="none"/></svg></span>日志中心</button>
        <div class="sidebar-footer"><span class="status-dot"></span><span>系统运行中</span></div>
      </nav>
      <section class="content" aria-live="polite">
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
        <section id="view-overview" class="view" aria-labelledby="overviewTitle"></section>
        <section id="view-users" class="view hidden" aria-labelledby="usersTitle"></section>
        <section id="view-orders" class="view hidden" aria-labelledby="ordersTitle"></section>
        <section id="view-models" class="view hidden" aria-labelledby="modelsTitle"></section>
        <section id="view-credentials" class="view hidden" aria-labelledby="credentialsTitle"></section>
        <section id="view-invites" class="view hidden" aria-labelledby="invitesTitle"></section>
        <section id="view-announcements" class="view hidden" aria-labelledby="announcementsTitle"></section>
        <section id="view-logs" class="view hidden" aria-labelledby="logsTitle"></section>
      </section>
    </div>
  </main>

  <dialog id="adminDialog" class="admin-dialog" aria-labelledby="adminDialogTitle" aria-describedby="adminDialogDescription">
    <form id="adminDialogForm" class="admin-dialog-card">
      <header class="admin-dialog-head"><div><span id="adminDialogKicker" class="admin-dialog-kicker">编辑操作</span><h2 id="adminDialogTitle">编辑</h2><p id="adminDialogDescription"></p></div><button id="adminDialogClose" class="admin-dialog-close" type="button" aria-label="关闭">×</button></header>
      <div id="adminDialogBody" class="admin-dialog-body"></div>
      <div id="adminDialogError" class="admin-dialog-error" role="alert"></div>
      <footer class="admin-dialog-footer"><button id="adminDialogCancel" class="ghost" type="button">取消</button><button id="adminDialogSubmit" class="primary" type="submit">保存</button></footer>
    </form>
  </dialog>
  <script type="module" src="/guguadmin.js?v=13"></script>
</body>
</html>
