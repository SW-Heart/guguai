<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕的海边骑行</title>
<style>
:root{color-scheme:light;--ink:#234d60;--sea:#70bbc8;--paper:#eff7f8;--coral:#ed7566;--sun:#f6ca69}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif;min-height:100svh;display:grid;place-items:center;padding:32px 20px}main{width:min(1080px,100%)}header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:0 8px 26px}h1{font-family:"Songti SC",serif;font-size:clamp(28px,4vw,44px);font-weight:600;letter-spacing:.08em;margin:0 0 10px}p{margin:0;font-size:14px;line-height:1.8;color:#5a7d8a}.scene{overflow:hidden;border-radius:28px;background:#d9edf1;box-shadow:0 18px 50px #234d6010}svg{display:block;width:100%;height:auto}footer{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:24px 8px}.controls{display:flex;align-items:center;gap:18px}button{border:0;border-radius:30px;background:var(--ink);color:white;padding:12px 23px;font:inherit;font-size:14px;cursor:pointer;min-width:105px}button:hover{background:#35677b}button:focus-visible,input:focus-visible{outline:3px solid var(--coral);outline-offset:5px}label{display:flex;gap:12px;align-items:center;font-size:13px}input{width:100px;accent-color:var(--ink)}output{min-width:32px;font-variant-numeric:tabular-nums}.note{font-size:12px;color:#63808a}@media(max-width:580px){body{padding:26px 12px}header{margin-bottom:20px}footer{flex-wrap:wrap;padding:20px 4px}.note{width:100%}.scene{border-radius:18px}.controls{gap:12px}input{width:75px}}

.controls{flex-wrap:wrap}#turbo{background:#e67838}#turbo[aria-pressed="true"]{background:#c84b28;box-shadow:0 0 0 4px #f6ca6938}.scene.turbo{box-shadow:0 18px 50px #ed756630}.note{min-width:150px}
</style>
</head>
<body>
<main>
<header><div><h1>让海风带路</h1><p>一只鹈鹕，一辆单车，一整个悠闲午后。</p></div></header>
<div class="scene">
<svg id="scene" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
<title id="title">鹈鹕骑自行车的二维动画</title><desc id="desc">白色鹈鹕踩着珊瑚红自行车沿海岸前进，车轮旋转，围巾随风飘动，远处有阳光、帆船和流动的云。</desc>
<defs>
<linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d6edf2"/><stop offset="1" stop-color="#f0f7ed"/></linearGradient>
<g id="cloud" fill="#fff" opacity=".75"><path d="M0 22 Q5 4 28 10 Q35-12 60 3 Q80-7 88 13 Q115 10 120 26 H0Z"/></g>
<g id="spokes" stroke="#93abb0" stroke-width="2"><path d="M-70 0H70M0-70V70M-49-49L49 49M-49 49L49-49M-65-27L65 27M-27-65L27 65M-65 27L65-27M-27 65L27-65"/></g>
<g id="wheel"><circle r="81" fill="#edf4ed" fill-opacity=".4" stroke="#234d60" stroke-width="10"/><circle r="72" fill="none" stroke="#fff6df" stroke-width="4"/><use href="#spokes"/><circle r="8" fill="#234d60"/><path d="M-19-76A79 79 0 0 1 22-75" fill="none" stroke="#6d919c" stroke-width="3" stroke-linecap="round"/></g>
<g id="grass" fill="none" stroke="#639d8b" stroke-width="3" stroke-linecap="round"><path d="M0 0L-8-15M0 0Q2-22 9-25M0 0L15-12"/></g>
</defs>
<path fill="url(#sky)" d="M0 0H1080V650H0Z"/>
<circle cx="852" cy="121" r="52" fill="#f6ca69"/><circle cx="852" cy="121" r="65" fill="none" stroke="#f6ca69" opacity=".2" stroke-width="12"/>
<g id="clouds"><use href="#cloud" x="100" y="105"/><use href="#cloud" x="430" y="58" transform="translate(130 10) scale(.8)"/><use href="#cloud" x="920" y="205"/></g>
<path d="M0 302Q120 271 220 297T445 298T685 292T895 301T1080 285V380H0Z" fill="#a6ced0"/>
<path d="M0 329Q250 310 540 334T1080 326V470H0Z" fill="#70bbc8"/>
<g stroke="#d2ebea" stroke-width="3" stroke-linecap="round" opacity=".75" id="ripples"><path d="M40 364h70m105 37h92m68-48h55m270 23h78m112-29h74m-570 81h110m292-6h105"/></g>
<g id="boat" transform="translate(825 282)"><path d="M-26 37H33L22 49H-14Z" fill="#426f80"/><path d="M2-24V34H-29Z" fill="#fffaf0"/><path d="M8-11L31 32H8Z" fill="#ec927c"/><path d="M4-28V38" stroke="#426f80" stroke-width="2"/></g>
<path d="M0 440Q160 413 340 442T670 440T1080 435V650H0Z" fill="#d5dfb6"/>
<path d="M0 503Q300 481 570 502T1080 493V593H0Z" fill="#f0dfb9"/><path d="M0 592H1080" stroke="#d9c89f" stroke-width="3"/>
<g id="ground"><path d="M0 556h55m110 0h55m110 0h55m110 0h55m110 0h55m110 0h55m110 0h55m110 0h55" stroke="#fff6df" stroke-width="5" stroke-linecap="round"/><use href="#grass" x="100" y="477"/><use href="#grass" x="385" y="627"/><use href="#grass" x="840" y="478"/><use href="#grass" x="1050" y="624"/></g>
<ellipse cx="536" cy="543" rx="228" ry="14" fill="#526e65" opacity=".12"/>
<g id="rider">
<g transform="translate(380 450)"><g id="rearWheel"><use href="#wheel"/></g></g><g transform="translate(684 450)"><g id="frontWheel"><use href="#wheel"/></g></g>
<path d="M303 421A85 85 0 0 1 457 415M608 414A85 85 0 0 1 756 407" stroke="#f4a08b" stroke-width="6" fill="none" stroke-linecap="round"/>
<path id="farLeg" d="M495 345L480 397L548 445" fill="none" stroke="#d69a4b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<g fill="none" stroke="#ed7566" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"><path d="M380 450L464 337L526 450ZM464 337H640L526 450M625 309L684 450M453 312L464 337"/></g>
<path d="M625 309L615 282H652Q670 282 663 300" fill="none" stroke="#234d60" stroke-width="7" stroke-linecap="round"/>
<path d="M432 310H483" stroke="#234d60" stroke-width="13" stroke-linecap="round"/>
<path d="M380 442L526 430A20 20 0 0 1 526 470L380 458Z" fill="#254e60" fill-opacity=".08" stroke="#456877" stroke-width="2"/>
<circle cx="526" cy="450" r="22" fill="#f7e9ca" stroke="#234d60" stroke-width="4"/><g id="crank" stroke="#234d60" stroke-width="5"><path d="M-32 0H32"/><circle r="5" fill="#234d60"/></g>
<g id="bird">
<path d="M444 268L391 245L414 283L391 279Q413 311 451 310" fill="#f8fbf4" stroke="#234d60" stroke-width="3" stroke-linejoin="round"/>
<path d="M436 258Q470 232 514 259Q532 268 547 234Q554 217 547 181Q540 144 571 129Q600 111 622 135Q643 158 620 181Q602 200 603 239Q608 287 565 321Q520 352 464 319Q438 304 436 258Z" fill="#fffcf0" stroke="#234d60" stroke-width="3.5"/>
<path d="M565 182Q579 219 565 261Q553 291 527 304" fill="none" stroke="#dbe4d9" stroke-width="13" stroke-linecap="round"/>
<path d="M469 270Q510 248 550 284Q525 315 475 292" fill="#e5ece1" stroke="#234d60" stroke-width="3" stroke-linejoin="round"/>
<path d="M487 279Q514 280 533 289M478 286L507 296" fill="none" stroke="#a4b9b2" stroke-width="2" stroke-linecap="round"/>
<path d="M610 159L759 180Q702 237 625 192Z" fill="#f6ca69" stroke="#234d60" stroke-width="3" stroke-linejoin="round"/>
<path d="M612 154Q673 153 759 180L613 178" fill="#efa456" stroke="#234d60" stroke-width="3" stroke-linejoin="round"/>
<path d="M635 186Q677 203 716 190" stroke="#e8af54" stroke-width="3" fill="none"/>
<circle cx="603" cy="147" r="7" fill="#234d60"/><circle cx="605" cy="145" r="2" fill="white"/>
<path d="M589 132Q599 126 608 132M563 128L554 116M570 123L567 111" fill="none" stroke="#234d60" stroke-width="3" stroke-linecap="round"/>
<g fill="#ed7566" stroke="#bd6558" stroke-width="2"><path id="scarf" d="M559 206Q518 190 480 215L494 198L477 183Q526 179 565 193Z"/><path d="M556 189Q578 198 599 192L598 206Q577 212 555 204Z"/></g>
<path d="M538 269Q573 281 616 283" fill="none" stroke="#234d60" stroke-width="14" stroke-linecap="round"/><path d="M538 268Q573 280 616 282" fill="none" stroke="#f9faf0" stroke-width="9" stroke-linecap="round"/>
</g>
<path id="nearLeg" d="M499 321L477 385L558 450" fill="none" stroke="#eab15b" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
<path id="farFoot" fill="#d69a4b" stroke="#234d60" stroke-width="2"/><path id="nearFoot" fill="#f6ca69" stroke="#234d60" stroke-width="2"/>
<g stroke="#234d60" stroke-width="6" stroke-linecap="round"><path id="pedal1"/><path id="pedal2"/></g>
</g>
<g id="sparks" fill="none" stroke-linecap="round" aria-hidden="true"></g><g id="rush" fill="none" stroke="#fffaf0" stroke-width="3" stroke-linecap="round" aria-hidden="true"></g>
<g fill="none" stroke="#fffaf0" stroke-width="3" stroke-linecap="round" opacity=".8"><path d="M302 248h-36m47 18h-62m50 19h-27"/></g>
</svg>
</div>
<footer><div class="controls"><button id="toggle" type="button" aria-pressed="false">暂停动画</button><button id="turbo" type="button" aria-pressed="false">开启极速</button><label for="speed">骑行速度 <input id="speed" type="range" min="0.5" max="3" step="0.25" value="1.5"><output id="rate" for="speed">1.5×</output></label></div><span class="note" id="status" aria-live="polite">慢慢骑，沿途都是好风景。</span></footer>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id), motion=matchMedia('(prefers-reduced-motion: reduce)');
let paused=motion.matches, speed=1.5, time=0, last=null, turbo=false;
const toggle=$('toggle');
const ns='http://www.w3.org/2000/svg';
const sparks=Array.from({length:42},(_,i)=>{const el=document.createElementNS(ns,'path');el.setAttribute('stroke', ['#ff8738','#ef562e','#ffd65c'][i%3]);el.setAttribute('stroke-width',i%3===0?'4':'2.5');$('sparks').appendChild(el);return el});
const rush=Array.from({length:9},()=>{const el=document.createElementNS(ns,'path');$('rush').appendChild(el);return el});
function rate(){ $('rate').value=(turbo?speed*3:speed)+'×'; }
$('turbo').addEventListener('click',()=>{turbo=!turbo;$('turbo').setAttribute('aria-pressed',String(turbo));$('turbo').textContent=turbo?'退出极速':'开启极速';document.querySelector('.scene').classList.toggle('turbo',turbo);$('status').textContent=turbo?'极速模式 · 脚踏冒火星！':'慢慢骑，沿途都是好风景。';rate()});
function sync(){toggle.textContent=paused?'播放动画':'暂停动画';toggle.setAttribute('aria-pressed',String(paused));}
toggle.addEventListener('click',()=>{paused=!paused;sync()});
motion.addEventListener('change',event=>{paused=event.matches;sync()});
$('speed').addEventListener('input',event=>{speed=Number(event.target.value);rate()});
function draw(t){
$('sparks').setAttribute('opacity',turbo?'1':'0');$('rush').setAttribute('opacity',turbo?'.65':'0');
const a=t*3.8, degrees=a*180/Math.PI, bob=Math.sin(a*2)*1.7;
if(turbo){
 sparks.forEach((el,i)=>{
 const age=((t*.8+i*.618)%1), pedal=i%3!==0, birthAngle=(t-age/.8)*3.8;
 const originX=pedal?526+32*Math.cos(birthAngle):380;
 const originY=pedal?450+32*Math.sin(birthAngle):529;
 const x=originX-age*(95+(i%7)*17), y=originY-Math.sin(age*Math.PI)*((i%5)*13+20)+age*age*20;
 el.setAttribute('d',`M${x} ${y}l${8+age*13} ${-4+age*8}`);el.setAttribute('opacity',String((1-age)*.95));
 });
 rush.forEach((el,i)=>{const phase=(t*.35+i*.137)%1,x=1080-phase*1300,y=160+(i*47)%340;el.setAttribute('d',`M${x} ${y}h${35+i%3*25}`);el.setAttribute('opacity',String(Math.sin(phase*Math.PI)*.6))});
}
$('rearWheel').setAttribute('transform',`rotate(${degrees})`);$('frontWheel').setAttribute('transform',`rotate(${degrees})`);
$('rider').setAttribute('transform',`translate(0 ${bob})`);$('crank').setAttribute('transform',`translate(526 450) rotate(${degrees})`);
for(const [name,angle,index] of [['near',a,1],['far',a+Math.PI,2]]){
const x=526+32*Math.cos(angle),y=450+32*Math.sin(angle),kneeX=479+13*Math.cos(angle),kneeY=380+9*Math.sin(angle);
$(name+'Leg').setAttribute('d',`M499 323 Q${kneeX-7} ${kneeY-18} ${kneeX} ${kneeY} L${x} ${y-7}`);
$(name+'Foot').setAttribute('d',`M${x-9} ${y-10}Q${x+4} ${y-12} ${x+22} ${y+1}L${x-12} ${y+1}Z`);
$('pedal'+index).setAttribute('d',`M${x-14} ${y+4}h34`);
}
$('scarf').setAttribute('d',`M559 206Q518 ${190+Math.sin(a)*7} 480 ${210+Math.sin(a+.7)*9}L494 198L477 ${183+Math.sin(a+.7)*9}Q526 ${179+Math.sin(a)*7} 565 193Z`);
$('ground').setAttribute('transform',`translate(${-((t*85)%165)} 0)`);
$('clouds').setAttribute('transform',`translate(${-((t*7)%1250)} 0)`);
$('boat').setAttribute('transform',`translate(${825-Math.sin(t*.1)*45} ${282+Math.sin(t*1.4)*2})`);
$('ripples').setAttribute('transform',`translate(${Math.sin(t*.6)*12} 0)`);
}
function frame(now){if(last!==null&&!paused)time+=Math.min((now-last)/1000,.05)*speed*(turbo?3:1);last=now;draw(time);requestAnimationFrame(frame)}
sync();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
